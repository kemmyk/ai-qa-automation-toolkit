openapi: 3.0.3
info:
  title: AI QA Toolkit Sample API
  description: >
    Minimal OpenAPI used with Newman and Postman collection generation.
    Points at Swagger Petstore for runnable smoke requests.
  version: 1.0.0
servers:
  - url: https://petstore.swagger.io/v2
    description: Public demo API
paths:
  /store/inventory:
    get:
      summary: Pet inventory by status
      operationId: getInventory
      tags:
        - store
      responses:
        "200":
          description: Map of status codes to quantities
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
              example:
                available: 10
                pending: 5
                sold: 2
  /pet/{petId}:
    get:
      summary: Find pet by ID
      operationId: getPetById
      tags:
        - pet
      parameters:
        - name: petId
          in: path
          required: true
          description: ID of pet to return
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Invalid ID supplied
        "404":
          description: Pet not found
components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          enum: [available, pending, sold]
      example:
        id: 1
        name: "doggie"
        status: available
