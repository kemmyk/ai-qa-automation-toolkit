name: API & E2E tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  newman:
    name: Newman (Postman)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # Skip postinstall (Playwright); this job only needs Newman.
        run: npm ci --ignore-scripts

      - name: Run Newman
        # Exits non-zero when any pm.test fails → job fails.
        run: npm run test:newman:ci

      - name: Upload Newman JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.json
          if-no-files-found: ignore
          retention-days: 14

  playwright-e2e:
    name: Playwright E2E
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # Exits non-zero on test failures → job fails.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
